<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Score Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- ✅ Solo bloqueo de teclado, sin script de título -->
    <script>
        document.addEventListener('keydown', (e) => {
            if(e.altKey && e.key === 'ArrowLeft') e.preventDefault()
        })
    </script>
   
   
</head>
<body>
    <div class="dashboard">
        <div>
            <div class="turno-switch-1">
                <button class="turno-btn active" id="btn1" onclick="setTurno(1)">🔵 Turno 1</button>    
            </div>
            <h1 id="tituloUnidad"></h1>
            <div class="turno-switch-2">
                <button class="turno-btn " id="btn2" onclick="setTurno(2)">🔴 Turno 2</button> 
            </div>
        </div>
        <h3 id="subtituloUnidad">Cantidad de Rechazos Semanales</h3>
        <div class="scale"></div>

        <div class="sky">
            <div id="alertaContainer"></div>
            <div id="rocketContainer"></div>
        </div>

        <!-- ✅ AQUÍ afuera, nunca dentro del rocketContainer -->
        

        

    </div>
   
    <script src="script.js"></script>
</body>
</html>
